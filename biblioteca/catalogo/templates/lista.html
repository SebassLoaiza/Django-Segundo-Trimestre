<!DOCTYPE html>
<html>

<head>
    <title>Biblioteca - Sebastian</title>
</head>

<body>
    <h1>Biblioteca - Sebastian</h1>

        <h3>{{ libro.titulo }}</h3>
        <p>{{ libro.autor }}</p>

        <a href="/reservar/{{ libro.id }}">
            Reservar libro

    </div>

    <hr>

    {% endfor %}

</body>

</html>
